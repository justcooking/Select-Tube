name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/SelectTube-v1.0.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SelectTube v1.0.0"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ### 🚀 SelectTube v1.0.0 Initial Release

            A strictly curated, subscription-only YouTube client for Android. Zero algorithmic rabbit holes, zero recommendations, and complete distraction-free focus.

            #### 📱 Direct Download
            Click the download link below to install on your Android device (Android 8.0+):
            - **[Download SelectTube-v1.0.0.apk](https://github.com/justcooking/Select-Tube/releases/download/v1.0.0/SelectTube-v1.0.0.apk)**

            #### ✨ Key Features
            - **Curated Whitelist:** Feeds and searches are strictly restricted to approved channels.
            - **Custom Independent Playlists:** Create and manage offline local playlists without any YouTube account.
            - **Queue & Navigation:** Up Next queue, forward/backward video skip buttons, instant queue shuffle.
            - **Sleep Timer:** 15m, 30m, 45m, 60m, or stop at end of current video.
            - **Save Queue as Playlist:** Export your active playback queue into a new or existing playlist.
            - **Background & Mini-Player:** Seamless picture-in-picture and background audio with lock-screen media controls.
            - **Parental Controls & Focus Mode:** BCrypt master password, cooling-off delay on channel additions, bedtime schedules, and daily screen time limits.
          files: release-assets/SelectTube-v1.0.0.apk
